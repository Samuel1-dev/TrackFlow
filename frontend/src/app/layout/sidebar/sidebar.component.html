<aside
  class="w-64 flex flex-col h-full bg-white dark:bg-surface-cardDark border-r border-slate-100 dark:border-slate-800 transition-all duration-300 z-30"
>
  <!-- Logo Branding -->
  <div class="h-20 flex items-center justify-between px-6 border-b border-slate-50 dark:border-slate-800/60">
    <a routerLink="/dashboard" class="flex items-center gap-3 group">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-purple-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform">
        <app-icon name="dashboard" [size]="20" [strokeWidth]="2.2"></app-icon>
      </div>
      <div>
        <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300 bg-clip-text text-transparent">
          TaskFlow
        </span>
        <span class="block text-[10px] font-semibold text-brand-600 dark:text-brand-400 tracking-wider uppercase">Productivité & Finance</span>
      </div>
    </a>

    <!-- Mobile Close Button -->
    <button
      (click)="closeMobileSidebar.emit()"
      class="lg:hidden p-2 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-white"
    >
      <app-icon name="x" [size]="20"></app-icon>
    </button>
  </div>

  <!-- Main Navigation Modules -->
  <div class="flex-1 overflow-y-auto px-4 py-6 space-y-8">
    <div>
      <p class="px-3 mb-2 text-[11px] font-bold tracking-wider text-slate-400 dark:text-slate-500 uppercase">
        Navigation
      </p>
      <nav class="space-y-1.5">
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-brand-50 dark:bg-brand-500/15 text-brand-600 dark:text-brand-400 font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="onNavigate()"
          class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-white transition-all group"
        >
          <app-icon name="dashboard" [size]="19" className="group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors"></app-icon>
          <span>Tableau de bord</span>
        </a>

        <a
          routerLink="/projects"
          routerLinkActive="bg-brand-50 dark:bg-brand-500/15 text-brand-600 dark:text-brand-400 font-semibold"
          (click)="onNavigate()"
          class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-white transition-all group"
        >
          <app-icon name="projects" [size]="19" className="group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors"></app-icon>
          <span>Projets</span>
        </a>

        <a
          routerLink="/tasks"
          routerLinkActive="bg-brand-50 dark:bg-brand-500/15 text-brand-600 dark:text-brand-400 font-semibold"
          (click)="onNavigate()"
          class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-white transition-all group"
        >
          <app-icon name="tasks" [size]="19" className="group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors"></app-icon>
          <span>Tâches</span>
        </a>

        <a
          routerLink="/finance/budgets"
          routerLinkActive="bg-brand-50 dark:bg-brand-500/15 text-brand-600 dark:text-brand-400 font-semibold"
          (click)="onNavigate()"
          class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-white transition-all group"
        >
          <app-icon name="budgets" [size]="19" className="group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors"></app-icon>
          <span>Budgets</span>
        </a>

        <a
          routerLink="/finance/expenses"
          routerLinkActive="bg-brand-50 dark:bg-brand-500/15 text-brand-600 dark:text-brand-400 font-semibold"
          (click)="onNavigate()"
          class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-white transition-all group"
        >
          <app-icon name="expenses" [size]="19" className="group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors"></app-icon>
          <span>Dépenses</span>
        </a>
      </nav>
    </div>

    <!-- Quick Links (Actions Rapides) -->
    <div>
      <p class="px-3 mb-2 text-[11px] font-bold tracking-wider text-slate-400 dark:text-slate-500 uppercase">
        Actions rapides
      </p>
      <div class="space-y-1.5">
        <button
          (click)="openNewTask()"
          class="w-full flex items-center gap-3 px-3.5 py-2 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/70 transition-colors text-left"
        >
          <div class="w-6 h-6 rounded-lg bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
            <app-icon name="plus" [size]="14"></app-icon>
          </div>
          <span>Nouvelle tâche</span>
        </button>

        <button
          (click)="openNewBudget()"
          class="w-full flex items-center gap-3 px-3.5 py-2 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/70 transition-colors text-left"
        >
          <div class="w-6 h-6 rounded-lg bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
            <app-icon name="budgets" [size]="14"></app-icon>
          </div>
          <span>Nouveau budget</span>
        </button>

        <button
          (click)="openNewExpense()"
          class="w-full flex items-center gap-3 px-3.5 py-2 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/70 transition-colors text-left"
        >
          <div class="w-6 h-6 rounded-lg bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400 flex items-center justify-center">
            <app-icon name="expenses" [size]="14"></app-icon>
          </div>
          <span>Ajouter une dépense</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom Card: Upgrade / Productivity Badge (like Finora Pro card) -->
  <div class="p-4 m-3 rounded-2xl bg-gradient-to-br from-brand-50 to-indigo-50/50 dark:from-slate-800/80 dark:to-slate-800/30 border border-brand-100/60 dark:border-slate-700/60">
    <div class="flex items-center gap-2 mb-1.5">
      <span class="inline-block p-1.5 rounded-lg bg-brand-600 text-white shadow-sm">
        <app-icon name="analytics" [size]="13"></app-icon>
      </span>
      <span class="text-xs font-bold text-slate-900 dark:text-white">TaskFlow 2026</span>
    </div>
    <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed mb-3">
      Planifiez votre temps et maîtrisez votre budget au même endroit.
    </p>
    <div class="flex items-center justify-between text-[11px] font-semibold text-brand-600 dark:text-brand-400">
      <span>Version Web</span>
      <span class="px-2 py-0.5 rounded-full bg-brand-100 dark:bg-brand-950 text-[10px]">Actif</span>
    </div>
  </div>
</aside>
