<header class="h-20 bg-white/80 dark:bg-surface-cardDark/80 backdrop-blur-md border-b border-slate-100 dark:border-slate-800 px-6 flex items-center justify-between sticky top-0 z-20 transition-colors">
  <!-- Left side: Mobile Toggle & Search Bar -->
  <div class="flex items-center gap-4 flex-1 max-w-xl">
    <!-- Mobile menu toggle -->
    <button
      (click)="toggleMobileSidebar.emit()"
      class="lg:hidden p-2 rounded-xl text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
    >
      <app-icon name="menu" [size]="22"></app-icon>
    </button>

    <!-- Search Bar (matching Finora search input) -->
    <div class="relative w-full max-w-md hidden sm:block">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
        <app-icon name="search" [size]="16"></app-icon>
      </div>
      <input
        type="text"
        placeholder="Rechercher une tâche, un projet, une dépense..."
        class="w-full pl-10 pr-12 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all"
      />
      <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
        <kbd class="px-1.5 py-0.5 text-[10px] font-semibold text-slate-400 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded">⌘K</kbd>
      </div>
    </div>
  </div>

  <!-- Right side: Theme Toggle, Notifications & User Profile -->
  <div class="flex items-center gap-3.5">
    <!-- Theme Toggle Button (Light / Dark / System) -->
    <div class="relative">
      <button
        (click)="toggleThemeMenu()"
        class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700/80 text-slate-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 transition-all flex items-center gap-1.5"
        [title]="'Mode: ' + themeService.mode()"
      >
        @if (themeService.mode() === 'light') {
          <app-icon name="sun" [size]="18"></app-icon>
        } @else if (themeService.mode() === 'dark') {
          <app-icon name="moon" [size]="18"></app-icon>
        } @else {
          <app-icon name="laptop" [size]="18"></app-icon>
        }
      </button>

      <!-- Dropdown Theme Picker -->
      @if (isThemeMenuOpen) {
        <div
          class="absolute right-0 mt-2 w-36 rounded-2xl bg-white dark:bg-surface-cardDark shadow-xl border border-slate-100 dark:border-slate-800 py-1.5 z-50 animate-in fade-in slide-in-from-top-2 duration-150"
        >
          <button
            (click)="setTheme('light')"
            class="w-full flex items-center gap-2.5 px-3.5 py-2 text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800/80 transition-colors"
            [class.text-brand-600]="themeService.mode() === 'light'"
          >
            <app-icon name="sun" [size]="15"></app-icon>
            <span>Clair</span>
          </button>
          <button
            (click)="setTheme('dark')"
            class="w-full flex items-center gap-2.5 px-3.5 py-2 text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800/80 transition-colors"
            [class.text-brand-600]="themeService.mode() === 'dark'"
          >
            <app-icon name="moon" [size]="15"></app-icon>
            <span>Sombre</span>
          </button>
          <button
            (click)="setTheme('system')"
            class="w-full flex items-center gap-2.5 px-3.5 py-2 text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800/80 transition-colors"
            [class.text-brand-600]="themeService.mode() === 'system'"
          >
            <app-icon name="laptop" [size]="15"></app-icon>
            <span>Système</span>
          </button>
        </div>
      }
    </div>

    <!-- Notification Bell -->
    <button
      class="relative p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700/80 text-slate-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 transition-all"
    >
      <app-icon name="bell" [size]="18"></app-icon>
      <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-rose-500 ring-2 ring-white dark:ring-surface-cardDark"></span>
    </button>

    <div class="h-6 w-px bg-slate-200 dark:bg-slate-800 mx-1"></div>

    <!-- User Profile Dropdown (matching Finora top right) -->
    <div class="relative">
      <button
        (click)="toggleUserMenu()"
        class="flex items-center gap-3 p-1 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/60 transition-colors"
      >
        <!-- Avatar -->
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 text-white font-bold text-sm flex items-center justify-center shadow-sm">
          {{ getInitials() }}
        </div>
        <!-- Name & Status -->
        <div class="text-left hidden md:block">
          <span class="block text-sm font-bold text-slate-900 dark:text-white leading-tight">
            {{ user() ? user()?.firstName + ' ' + user()?.lastName : 'Utilisateur' }}
          </span>
          <span class="block text-[11px] text-slate-400 dark:text-slate-400">
            Devise: {{ user()?.currency || 'XOF' }}
          </span>
        </div>
        <app-icon name="chevron-down" [size]="14" className="text-slate-400 hidden md:block"></app-icon>
      </button>

      <!-- User Menu -->
      @if (isUserMenuOpen) {
        <div
          class="absolute right-0 mt-2 w-48 rounded-2xl bg-white dark:bg-surface-cardDark shadow-xl border border-slate-100 dark:border-slate-800 py-1.5 z-50 animate-in fade-in slide-in-from-top-2 duration-150"
        >
          <div class="px-4 py-2 border-b border-slate-100 dark:border-slate-800 text-xs text-slate-500">
            Connecté en tant que<br>
            <strong class="text-slate-800 dark:text-slate-200">{{ user()?.email }}</strong>
          </div>
          <button
            (click)="logout()"
            class="w-full flex items-center gap-2.5 px-4 py-2 text-xs font-semibold text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition-colors text-left"
          >
            <app-icon name="trash" [size]="14"></app-icon>
            <span>Se déconnecter</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
